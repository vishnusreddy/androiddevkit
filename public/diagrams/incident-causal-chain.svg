<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Production incident causal chain and prevention loop</title>
  <desc id="desc">A server field change exposed a serializer contract bug. Missing contract coverage and generic alerts delayed detection. Rollback and tolerant parsing mitigated the incident, followed by targeted prevention.</desc>
  <style>
    text{font:650 14px system-ui,sans-serif;fill:#1d2b23}.heading{font-size:16px;font-weight:800}.sub{font-size:12px;font-weight:500;fill:#52645a}.box{fill:#fff;stroke:#b9cec1;stroke-width:2}.accent{fill:#e9f7ed;stroke:#169447;stroke-width:2}.danger{fill:#fff4ef;stroke:#c65b35;stroke-width:2}.line{fill:none;stroke:#52645a;stroke-width:2.2;marker-end:url(#arrow)}.loop{fill:none;stroke:#168a47;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#green-arrow)}
    @media(prefers-color-scheme:dark){text{fill:#ecf4ef}.sub{fill:#a8b9af}.box{fill:#17211b;stroke:#405247}.accent{fill:#12351f;stroke:#55cc7a}.danger{fill:#351b14;stroke:#e38b68}.line{stroke:#a8b9af}.loop{stroke:#55cc7a}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
  </defs>
  <rect class="box" x="28" y="50" width="170" height="92" rx="15"/>
  <text class="heading" x="113" y="79" text-anchor="middle">Trigger</text><text class="sub" x="113" y="104" text-anchor="middle">server returns an</text><text class="sub" x="113" y="123" text-anchor="middle">explicit null variant</text>
  <rect class="danger" x="238" y="50" width="180" height="92" rx="15"/>
  <text class="heading" x="328" y="79" text-anchor="middle">Root cause</text><text class="sub" x="328" y="104" text-anchor="middle">serializer requires</text><text class="sub" x="328" y="123" text-anchor="middle">a non-null value</text>
  <rect class="danger" x="458" y="50" width="180" height="92" rx="15"/>
  <text class="heading" x="548" y="79" text-anchor="middle">User impact</text><text class="sub" x="548" y="104" text-anchor="middle">whole response fails</text><text class="sub" x="548" y="123" text-anchor="middle">content cannot render</text>
  <rect class="box" x="678" y="50" width="170" height="92" rx="15"/>
  <text class="heading" x="763" y="79" text-anchor="middle">Mitigation</text><text class="sub" x="763" y="104" text-anchor="middle">server rollback and</text><text class="sub" x="763" y="123" text-anchor="middle">tolerant client parsing</text>
  <rect class="accent" x="888" y="50" width="124" height="92" rx="15"/>
  <text class="heading" x="950" y="79" text-anchor="middle">Recovery</text><text class="sub" x="950" y="104" text-anchor="middle">verify metrics</text><text class="sub" x="950" y="123" text-anchor="middle">and users</text>
  <path class="line" d="M198 96H238M418 96H458M638 96H678M848 96H888"/>

  <text class="heading" x="28" y="208">Why controls did not contain it</text>
  <rect class="box" x="28" y="232" width="300" height="76" rx="14"/><text x="178" y="260" text-anchor="middle">Contract coverage gap</text><text class="sub" x="178" y="284" text-anchor="middle">omission tested, explicit null missing</text>
  <rect class="box" x="370" y="232" width="300" height="76" rx="14"/><text x="520" y="260" text-anchor="middle">Telemetry classification gap</text><text class="sub" x="520" y="284" text-anchor="middle">parse failure labeled as network error</text>
  <rect class="box" x="712" y="232" width="300" height="76" rx="14"/><text x="862" y="260" text-anchor="middle">Rollout detection gap</text><text class="sub" x="862" y="284" text-anchor="middle">alert could not isolate the new variant</text>
  <path class="line" d="M178 232V192H548V142M520 232V192M862 232V192H548"/>

  <rect class="accent" x="198" y="350" width="644" height="58" rx="15"/>
  <text x="520" y="375" text-anchor="middle">Prevention: contract case • typed parsing metric • compatibility checklist</text>
  <text class="sub" x="520" y="395" text-anchor="middle">change the system that allowed the incident, not only the line that failed</text>
  <path class="loop" d="M862 308V330H520V350M520 408H113V142"/>
</svg>
