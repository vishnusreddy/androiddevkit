<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">HTTP request and response lifecycle</title>
  <desc id="desc">A UI intent passes through ViewModel, repository, API interface, OkHttp, TLS, and the server. The response returns through HTTP handling, DTO parsing, model mapping, and UI state.</desc>
  <style>
    text{font:650 15px system-ui,sans-serif;fill:#1d2b23}.label{font-size:13px;font-weight:750;letter-spacing:.05em}.sub{font-size:12px;font-weight:500;fill:#52645a}.box{fill:#fff;stroke:#b9cec1;stroke-width:2}.accent{fill:#e9f7ed;stroke:#169447;stroke-width:2}.line{fill:none;stroke:#52645a;stroke-width:2.2;marker-end:url(#arrow)}.return{fill:none;stroke:#168a47;stroke-width:2.2;marker-end:url(#green-arrow)}
    @media(prefers-color-scheme:dark){text{fill:#ecf4ef}.sub{fill:#a8b9af}.box{fill:#17211b;stroke:#405247}.accent{fill:#12351f;stroke:#55cc7a}.line{stroke:#a8b9af}.return{stroke:#55cc7a}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
  </defs>
  <text class="label" x="24" y="30">REQUEST</text>
  <rect class="accent" x="24" y="50" width="140" height="60" rx="14"/><text x="94" y="76" text-anchor="middle">UI intent</text><text class="sub" x="94" y="96" text-anchor="middle">refresh, submit</text>
  <rect class="box" x="200" y="50" width="140" height="60" rx="14"/><text x="270" y="85" text-anchor="middle">ViewModel</text>
  <rect class="box" x="376" y="50" width="140" height="60" rx="14"/><text x="446" y="85" text-anchor="middle">Repository</text>
  <rect class="box" x="552" y="50" width="140" height="60" rx="14"/><text x="622" y="76" text-anchor="middle">Retrofit API</text><text class="sub" x="622" y="96" text-anchor="middle">method contract</text>
  <rect class="box" x="728" y="50" width="140" height="60" rx="14"/><text x="798" y="76" text-anchor="middle">OkHttp + TLS</text><text class="sub" x="798" y="96" text-anchor="middle">transport</text>
  <rect class="accent" x="904" y="50" width="112" height="60" rx="14"/><text x="960" y="85" text-anchor="middle">Server</text>
  <path class="line" d="M164 80H200M340 80H376M516 80H552M692 80H728M868 80H904"/>

  <path class="return" d="M960 110V183H880"/>
  <text class="label" x="24" y="214">RESPONSE</text>
  <rect class="box" x="736" y="180" width="144" height="60" rx="14"/><text x="808" y="206" text-anchor="middle">HTTP result</text><text class="sub" x="808" y="226" text-anchor="middle">status, headers, body</text>
  <rect class="box" x="556" y="180" width="144" height="60" rx="14"/><text x="628" y="206" text-anchor="middle">JSON DTO</text><text class="sub" x="628" y="226" text-anchor="middle">wire shape</text>
  <rect class="box" x="376" y="180" width="144" height="60" rx="14"/><text x="448" y="206" text-anchor="middle">Domain model</text><text class="sub" x="448" y="226" text-anchor="middle">validated meaning</text>
  <rect class="box" x="196" y="180" width="144" height="60" rx="14"/><text x="268" y="206" text-anchor="middle">UI model</text><text class="sub" x="268" y="226" text-anchor="middle">display-ready</text>
  <rect class="accent" x="24" y="180" width="136" height="60" rx="14"/><text x="92" y="215" text-anchor="middle">UI state</text>
  <path class="return" d="M736 210H700M556 210H520M376 210H340M196 210H160"/>

  <rect class="box" x="196" y="286" width="684" height="50" rx="13"/>
  <text x="538" y="307" text-anchor="middle">Failure is classified before it becomes UI behavior</text>
  <text class="sub" x="538" y="326" text-anchor="middle">transport, HTTP status, parsing, product invariant, or cancellation</text>
  <path class="line" d="M808 240V270H538V286"/>
</svg>
