<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Clean Architecture dependency rule</title>
  <desc id="desc">Presentation and data both depend inward on stable domain policies. Domain does not depend on Android, network, or storage details.</desc>
  <style>
    text{font:600 16px system-ui,sans-serif;fill:#1d2b23}.sub{font-size:13px;font-weight:500;fill:#52645a}.box{fill:#fff;stroke:#b9cec1;stroke-width:2}.core{fill:#e9f7ed;stroke:#169447;stroke-width:2}.line{fill:none;stroke:#52645a;stroke-width:2.2;marker-end:url(#a)}
    @media(prefers-color-scheme:dark){text{fill:#ecf4ef}.sub{fill:#a8b9af}.box{fill:#17211b;stroke:#405247}.core{fill:#12351f;stroke:#55cc7a}.line{stroke:#a8b9af}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
  <rect class="box" x="35" y="50" width="205" height="78" rx="16"/><text x="137" y="81" text-anchor="middle">Presentation</text><text class="sub" x="137" y="104" text-anchor="middle">UI and ViewModels</text>
  <rect class="core" x="307" y="35" width="205" height="108" rx="18"/><text x="409" y="73" text-anchor="middle">Domain policy</text><text class="sub" x="409" y="98" text-anchor="middle">entities, use cases, ports</text><text class="sub" x="409" y="119" text-anchor="middle">plain Kotlin</text>
  <rect class="box" x="580" y="50" width="205" height="78" rx="16"/><text x="682" y="81" text-anchor="middle">Data details</text><text class="sub" x="682" y="104" text-anchor="middle">Room, HTTP, cache</text>
  <path class="line" d="M240 89H307"/><path class="line" d="M580 89H512"/>
  <text class="sub" x="409" y="181" text-anchor="middle">Source-code dependencies point inward</text>
</svg>
