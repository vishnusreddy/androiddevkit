<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Feature and core module structure</title>
  <desc id="desc">The app module assembles feature modules. Features depend on shared core modules without depending directly on one another.</desc>
  <style>
    text{font:600 15px system-ui,sans-serif;fill:#1d2b23}.sub{font-size:12px;font-weight:500;fill:#52645a}.box{fill:#fff;stroke:#b9cec1;stroke-width:2}.accent{fill:#e9f7ed;stroke:#169447;stroke-width:2}.line{fill:none;stroke:#52645a;stroke-width:2}
    @media(prefers-color-scheme:dark){text{fill:#ecf4ef}.sub{fill:#a8b9af}.box{fill:#17211b;stroke:#405247}.accent{fill:#12351f;stroke:#55cc7a}.line{stroke:#a8b9af}}
  </style>
  <rect class="accent" x="355" y="20" width="190" height="55" rx="14"/><text x="450" y="45" text-anchor="middle">:app</text><text class="sub" x="450" y="63" text-anchor="middle">composition root</text>
  <path class="line" d="M450 75V105M155 105H745M155 105V125M450 105V125M745 105V125"/>
  <rect class="box" x="65" y="125" width="180" height="55" rx="14"/><text x="155" y="159" text-anchor="middle">:feature:feed</text>
  <rect class="box" x="360" y="125" width="180" height="55" rx="14"/><text x="450" y="159" text-anchor="middle">:feature:profile</text>
  <rect class="box" x="655" y="125" width="180" height="55" rx="14"/><text x="745" y="159" text-anchor="middle">:feature:settings</text>
  <path class="line" d="M155 180V214M450 180V214M745 180V214M105 214H795"/>
  <rect class="accent" x="40" y="220" width="150" height="50" rx="13"/><text x="115" y="250" text-anchor="middle">:core:data</text>
  <rect class="accent" x="208" y="220" width="150" height="50" rx="13"/><text x="283" y="250" text-anchor="middle">:core:domain</text>
  <rect class="accent" x="376" y="220" width="150" height="50" rx="13"/><text x="451" y="250" text-anchor="middle">:core:network</text>
  <rect class="accent" x="544" y="220" width="150" height="50" rx="13"/><text x="619" y="250" text-anchor="middle">:core:database</text>
  <rect class="accent" x="712" y="220" width="150" height="50" rx="13"/><text x="787" y="250" text-anchor="middle">:core:design</text>
</svg>
